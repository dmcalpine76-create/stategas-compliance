<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>State Gas Compliance Register</title>
<style>
:root{
  --paper:#F6F4F3;--surface:#FFFFFF;--ink:#1A1A1A;--muted:#6B6264;--rule:#E3DCDC;
  --crimson:#A51C30;--crimson-ink:#FFFFFF;--crimson-soft:#F6E4E7;--radius:10px;
  --bg:var(--paper);--panel:var(--surface);--fill:#F6F4F3;--red:var(--crimson);--tint:var(--crimson-soft);--mute:var(--muted);--mid:#8A7F82;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#151314;--surface:#1F1C1D;--ink:#EEE9E9;--muted:#A79C9E;--rule:#352F31;--crimson:#E0566B;--crimson-ink:#1A1A1A;--crimson-soft:#3A1F25;--fill:#262122;--mid:#A79C9E;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#151314;--surface:#1F1C1D;--ink:#EEE9E9;--muted:#A79C9E;--rule:#352F31;--crimson:#E0566B;--crimson-ink:#1A1A1A;--crimson-soft:#3A1F25;--fill:#262122;--mid:#A79C9E;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 Aptos,"Segoe UI",system-ui,-apple-system,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 22px;border-bottom:3px solid var(--crimson);padding:18px 20px 12px;max-width:1500px;margin:0 auto;background:transparent;position:static}
header .logo{background:transparent;padding:0;display:flex;align-items:center}
header .logo img{height:34px;display:block;border-radius:3px}
header .brand{display:grid;gap:2px}
header .brand small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--crimson);font-weight:700}
header h1{margin:0;font-size:26px;line-height:1.15;font-weight:700;color:var(--ink)}
header .sub{color:var(--muted);font-size:12.5px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav button{background:transparent;color:var(--crimson);border:1px solid var(--rule);border-radius:999px;font:inherit;font-weight:600;font-size:13.5px;padding:5px 14px;cursor:pointer}
nav button:hover{border-color:var(--crimson)}
nav button.on{background:var(--crimson);border-color:var(--crimson);color:var(--crimson-ink)}
nav .badge{background:var(--crimson);color:var(--crimson-ink);border-radius:999px;font-size:11px;padding:0 6px;margin-left:6px}
nav button.on .badge{background:var(--crimson-ink);color:var(--crimson)}
main{max-width:1500px;margin:0 auto;padding:22px 20px 60px}
h2{margin:0 0 14px;font-size:26px;line-height:1.15;font-weight:700;color:var(--ink)}
h3{margin:0 0 8px;font-size:16px;font-weight:700;color:var(--ink)}
.sec-head{margin:28px 0 10px;padding:0;background:none;color:var(--muted);font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.sec-head .r{font-weight:600;font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:6px 18px;overflow:hidden}
.panel:has(> .kv),.panel:has(> .bar),.panel:has(> h3){padding:14px 18px}
.grid{display:grid;gap:16px}
.g6{grid-template-columns:repeat(6,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1100px){.g6{grid-template-columns:repeat(3,1fr)}.g2,.g3{grid-template-columns:1fr}}
@media(max-width:640px){.g6{grid-template-columns:repeat(2,1fr)}}
.kpi{border:1px solid var(--rule);border-radius:var(--radius);padding:14px 16px;background:var(--surface);cursor:pointer}
.kpi:hover{border-color:var(--crimson)}
.kpi .n{font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi.red .n{color:var(--crimson)}
.kpi .l{color:var(--muted);font-size:13px}
.note{color:var(--muted);font-size:13px}
table{border-collapse:collapse;width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
th{background:var(--fill);color:var(--muted);text-align:left;padding:9px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;border-bottom:1px solid var(--rule);position:sticky;top:0}
td{padding:10px 12px;border-top:1px solid var(--rule);vertical-align:top}
tr.row{cursor:pointer}tr.row:hover td{background:var(--fill)}
.chip{display:inline-flex;align-items:center;font-size:12px;padding:1px 9px;border:1px solid var(--rule);border-radius:999px;margin-right:4px;white-space:nowrap;background:var(--surface);color:var(--muted)}
.chip.od{background:var(--crimson);color:var(--crimson-ink);border-color:var(--crimson);font-weight:700}
.chip.soon{background:var(--crimson-soft);color:var(--crimson);border-color:var(--crimson-soft);font-weight:600}
.chip.sev5{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.chip.sev4{background:var(--crimson-soft);color:var(--crimson);border-color:var(--crimson-soft)}
.chip.done{background:var(--fill);color:var(--muted);text-decoration:line-through}
.chip.ver{border-style:dashed;border-color:var(--crimson);color:var(--crimson);background:transparent}
.chip.calc{color:var(--muted);border-style:dotted}
button,.btn{font:inherit;font-weight:600;font-size:14px;padding:7px 16px;border-radius:7px;border:1px solid var(--crimson);background:transparent;color:var(--crimson);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--crimson-soft)}
.btn.p,.btn.k{background:var(--crimson);color:var(--crimson-ink)}
.btn.p:hover,.btn.k:hover{background:var(--crimson);filter:brightness(1.08)}
.btn.sm{padding:2px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--crimson);outline-offset:2px}
input,select,textarea{font:inherit;border:1px solid var(--rule);border-radius:7px;padding:7px 10px;background:var(--paper);color:var(--ink);max-width:100%}
textarea{width:100%;min-height:70px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.sev{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rule);margin-right:7px;vertical-align:middle}
.sev.s5{background:var(--crimson);box-shadow:0 0 0 3px var(--crimson-soft)}.sev.s4{background:var(--crimson)}.sev.s3{background:var(--mid)}
.item{display:grid;grid-template-columns:84px 1fr auto;gap:10px 14px;padding:13px 0;border-top:1px solid var(--rule);cursor:pointer;align-items:start}
.item:first-child{border-top:0}
.item:hover{background:var(--fill);margin:0 -18px;padding-left:18px;padding-right:18px}
.item .d{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.item .d.od{color:var(--crimson)}
.item .t{min-width:0}.item .t b{font-weight:700}.item .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.wk{margin-top:18px;padding:0 0 6px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:1px solid var(--rule)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.cal .h{background:var(--fill);color:var(--muted);padding:6px;text-align:center;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--rule)}
.cal .c{min-height:96px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:4px;overflow:hidden;background:var(--surface)}
.cal .c.o{background:var(--fill);opacity:.7}.cal .c.t{outline:2px solid var(--crimson);outline-offset:-2px}
.cal .c .n{font-size:12px;color:var(--muted)}
.cal .e{font-size:12px;padding:2px 6px;margin-top:3px;background:var(--fill);border-left:3px solid var(--mid);border-radius:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .e.s5{border-left-color:var(--crimson);font-weight:700}.cal .e.s4{border-left-color:var(--crimson)}
.cal .e.od{background:var(--crimson);color:var(--crimson-ink);border-left-color:var(--crimson-ink)}.cal .e.dn{text-decoration:line-through;opacity:.6}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);border-left:3px solid var(--crimson);z-index:40;overflow:auto;padding:18px 22px 40px;box-shadow:-6px 0 24px rgba(0,0,0,.2);transform:translateX(105%);transition:transform .18s}
#drawer.open{transform:none}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30;display:none}
#veil.on{display:block}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;margin:10px 0}.kv div:nth-child(odd){color:var(--muted);font-size:13px}
.bars .row{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;margin:6px 0;font-size:13.5px}
.bars .b{height:12px;background:var(--fill);border-radius:6px;overflow:hidden;display:flex}
.bars .b i{display:block;height:100%}
.card{border:1px solid var(--rule);border-radius:var(--radius);padding:16px 18px;margin:12px 0;background:var(--surface)}
.card.ap{border-left:4px solid var(--crimson)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.2);display:none}
.tag{font-size:12px;color:var(--muted)}
a{color:var(--crimson)}
.hide{display:none}
.legend span{margin-right:14px;font-size:12.5px}
code{background:var(--fill);padding:1px 5px;border-radius:4px}
@media print{header nav,.bar,#drawer,#veil{display:none}}
</style>

: 500 penalty units; s 636: 300 penalty units.", "owner": "", "conf": "verified", "known": [], "notes": "", "kind": "continuous", "review_days": 180, "src": [], "lead": null}, {"id": "t-well", "title": "Well obligations: drilling requirements (s 281), conversion notice within 10 business days (s 284), decommission before tenure/land ends (s 292)", "instrument": "ATP 2062 / PL 231", "regulator": "NRMMRRD", "category": "Tenure", "ref": "P&G Act ss 281, 284, 292", "what": "Comply with prescribed drilling requirements; notice within 10 business days after converting a well (e.g. to a water bore); plug and abandon (with notice) before tenure ends.", "rule": {"t": "event", "ev": "well_change"}, "sev": 4, "consequence": "s 281: 500 PU; s 284: 50 PU; s 292: 500 PU.", "owner": "", "conf": "verified", "known": [], "notes": "", "kind": "event", "review_days": null, "src": [], "lead": null}, {"id": "m-171b", "title": "AER/AEMO – annual reserves & resources return (NGR r 171B to AEMO; r 171C gas price assumptions + verification statement to AER)", "instrument": "Gas Bulletin Board field owner", "regulator": "AEMO / AER", "category": "Market reporting", "ref": "NGR rr 171A, 171B, 171C; AER Guidance Note Aug 2023", "what": "Annual submission of 1P/2P/3P reserves (developed/undeveloped) and 2C resources at year end (default 30 June) to AEMO within 40 business days after year end, with basis of preparation and independence statement; from year 2, detail on 2P changes. 171C: gas price assumptions and a verification statement go to the AER at the same time using the AER template (not needed for 2C-only fields). AER cannot exempt from the deadline. Independent qualified professional required for independence (an employee of the company cannot be independent).", "rule": {"t": "annual_bd", "m": 6, "d": 30, "bd": 40}, "sev": 5, "consequence": "AER compliance action; AER may require an independent audit at State Gas's cost (r 171C(1)). Civil penalty exposure under the National Gas Law to b rkets Portal, or email the template if on GBB Simplified.", "rule": {"t": "event", "ev": "interest_change"}, "sev": 4, "consequence": "AER compliance action.", "owner": "", "conf": "verified", "known": [], "notes": "", "kind": "event", "review_days": null, "src": [], "lead": null}, {"id": "m-gsoo", "title": "AEMO – GSOO/VGPR survey: confirm contact details and category (pre-survey), then respond", "instrument": "Producer / Explorer", "regulator": "AEMO", "category": "Market reporting", "ref": "NGL s 91DF; NGR r 135KF; GSOO Procedures", "what": "AEMO pre-survey notice (14 Aug 2026) required contact details and Producer/Explorer category confirmation by 24 Aug 2026. Survey templates for 2027 are dated 28 Aug 2026; AEMO typically requires a complete response within 20 business days of issue. Errors/material changes: notify AEMO as soon as practicable and provide an updated response within 10 business days. Confidentiality claims must be justified.", "rule": {"t": "annual_bd", "m": 8, "d": 28, "bd": 20}, "sev": 4, "consequence": "AEMO may refer non-response to the AER; detail of consequences not published on the page reviewed – confirm.", "owner": "", "conf": "verified", "known": [], "notes": "", "kind": "obligation", "review_days": null, "src": [{"t": "AEMO GSOO timelines, procedures and surveys", "u": "https://www.aemo.com.au/energy-systems/gas/gas-forecasting-and-planning/gas-statement-of-opportunities-gsoo/timelines-procedures-and-surveys"}], "lead": null}, {"id": "m-bb", "title": "AEMO – Gas Bulletin Board facility registration and daily reporting once a facility meets the thresholds", "instrument": "Rolleston West / HDNG (future)", "regulator": "AEMO", "category": "Market reporting", "ref": "NGR Part 18; AEMO BB registration", "what": "Production facility operators, gas field owners, pipelines etc. must register as BB reporting entities; no facility exemptions, only information exemptions. Daily production/flow data by 1 pm on gas day D; D+1 to D+6 forecasts; name xchange and annual meeting", "Within 20 business days after overlap arises and at least once each year; one meeting each year; confidentiality duties (compensation + account of commercial gain).", ""], ["MERCP Act", "205", "Chief executive may require copies of notices/consents", "Provide within the prescribed period.", ""]]};

<script>
/* ============================================================ helpers */
const $ = (s,e=document)=>e.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso = d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const pd = s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const diffD=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const HOLS=new Set(SEED.holidays.concat(["2026-08-12","2027-08-11"]).filter(x=>x!=="2027-04-26"));
const isBD=s=>{const d=pd(s).getDay();return d>0&&d<6&&!HOLS.has(s)};
function addBD(s,n){let st=n<0?-1:1,k=Math.abs(n),c=s;while(k){c=addD(c,st);if(isBD(c))k--;}return c}
function addM(s,n){const d=pd(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)}
const eom=(y,m)=>iso(new Date(y,m,0));
const TODAY=iso(new Date());
const fmt=s=>s?pd(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):'No date';
const fmtS=s=>s?pd(s).toLocaleDateString('en-AU',{day:'numeric',month:'short'}):'—';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)}

/* ============================================================ state */
let ST={inst:{},obl:{},events:[],custom:[],private:{},settings:{reminders:{5:[60,30,14,7,3,1,0],4:[30,14,7,3,1,0],3:[14,7,1,0],2:[7,0],1:[0]},owner:'',notify:false,theme:''},first:TODAY,log:[]};
let SERVER=false,MODE='cloud';
const GRAPH='https://graph.microsoft.com/v1.0';
const SCOPES=['Files.ReadWrite','Tasks.ReadWrite','User.Read'];
const DEFAULT_PATH='Documents/Current document editing/new AI projects/state gas compliance/private/compliance_data.json';
let MSAL=null,ACC=null,ETAG=null;
const cfg=()=>{try{return JSON.parse(localStorage.getItem('sg_cfg')||'null')}catch(e){return null}};
async function loadState(){
  try{const r=await fetch('/api/state',{cache:'no-store',signal:AbortSignal.timeout(2500)});
    if(r.ok&&(r.headers.get('content-type')||'').includes('json')){const j=await r.json();Object.assign(ST,j||{});SERVER=true;MODE='server';return true}}catch(e){}
  MODE='cloud';return await cloudLoad();
}
async function msalToken(interactive){
  try{return (await MSAL.acquireTokenSilent({scopes:SCOPES,account:ACC})).accessToken}
  catch(e){if(!interactive)throw e;const x=await MSAL.acquireTokenPopup({scopes:SCOPES,account:ACC});ACC=x.account;return x.accessToken}
}
async function cloudLoad(){
  const c=cfg();
  if(!c||!c.clientId){showSetup();return false}
  if(!window.msal){showSetup('The Microsoft sign-in library did not load – check your connection and reload.');return false}
  MSAL=new msal.PublicClientApplication({auth:{clientId:c.clientId,authority:'https://login.microsoftonline.com/'+(c.tenant||'common'),redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}});
  if(MSAL.initialize)await MSAL.initialize();
  try{await MSAL.handleRedirectPromise()}catch(e){}
  ACC=MSAL.getAllAccounts()[0]||null;
  if(!ACC){showSignIn();return false}
  try{
    const t=await msalToken(false),h={Authorization:'Bearer '+t},path=encodeURI(c.path||DEFAULT_PATH);
    const meta=await fetch(GRAPH+'/me/drive/root:/'+path,{headers:h});
    if(meta.status===404){ETAG=null;return true}
    if(!meta.ok)throw new Error('OneDrive '+meta.status);
    ETAG=(await meta.json()).eTag;
    const r=await fetch(GRAPH+'/me/drive/root:/'+path+':/content',{headers:h});
    if(!r.ok)throw new Error('OneDrive '+r.status);
    Object.assign(ST,await r.json());return true;
  }catch(e){showSignIn('Could not load your data: '+e.message+'. Sign in again or check the data path in Settings.');return false}
}
async function cloudSave(){
  const c=cfg(),path=encodeURI(c.path||DEFAULT_PATH);
  const t=await msalToken(true);
  const h={Authorization:'Bearer '+t,'Content-Type':'application/json'};if(ETAG)h['If-Match']=ETAG;
  const r=await fetch(GRAPH+'/me/drive/root:/'+path+':/content',{method:'PUT',headers:h,body:JSON.stringify(ST)});
  if(r.status===412){toast('Data was changed on another device – reload the page before editing further');return}
  if(!r.ok)throw new Error('OneDrive '+r.status);
  ETAG=(await r.json()).eTag;
}
function gate(title,body){$('#main').innerHTML=`<div class="panel" style="max-width:720px;margin:30px auto"><h2>${title}</h2>${body}</div>`;$('#nav').innerHTML=''}
function showSetup(msg){
  const c=cfg()||{};
  gate('Connect to your OneDrive',`${msg?`<p><b>${esc(msg)}</b></p>`:''}
  <p>Your live compliance data is kept in a private file in your own OneDrive – it is never part of this web page. Enter the details of your Microsoft app registration (these are IDs, not passwords).</p>
  <div class="kv"><div>Client ID</div><div><input id="cid" style="width:100%" value="${esc(c.clientId||'')}"></div>
  <div>Tenant</div><div><input id="ctn" style="width:100%" value="${esc(c.tenant||'')}" placeholder="your tenant ID, or common / organizations / consumers"></div>
  <div>Data file</div><div><input id="cpt" style="width:100%" value="${esc(c.path||DEFAULT_PATH)}"></div></div>
  <p class="note">The app registration needs: platform <b>Single-page application</b> with redirect URI <code>${esc(location.origin+location.pathname)}</code>; delegated permissions Files.ReadWrite, Tasks.ReadWrite, User.Read.</p>
  <div class="bar"><button class="btn p" id="cs">Save and continue</button></div>`);
  $('#cs').onclick=()=>{const v=$('#cid').value.trim();if(!v)return;localStorage.setItem('sg_cfg',JSON.stringify({clientId:v,tenant:$('#ctn').value.trim()||'common',path:$('#cpt').value.trim()||DEFAULT_PATH}));location.reload()};
}
function showSignIn(msg){

/* ============================================================ engine */
const HZ_BACK=45,HZ_FWD=480;
function genRule(o){
  const r=o.rule,out=[];const s=addD(TODAY,-HZ_BACK),e=addD(TODAY,HZ_FWD);
  const y0=pd(s).getFullYear(),y1=pd(e).getFullYear();
  const push=(d,t,extra)=>{if(d>=s&&d<=e)out.push(Object.assign({due:d,title:t||o.title,calc:true},extra||{}))};
  switch(r.t){
    case 'once': if(r.date>=s||true)out.push({due:r.date,title:o.title,calc:false});break;
    case 'annual': for(let y=y0;y<=y1;y++){push(iso(new Date(y,r.m-1,r.d)),null,{calc:false})}break;
    case 'quarterly': for(let y=y0;y<=y1;y++)for(const m of r.months){const d=r.d==='eom'?eom(y,m):iso(new Date(y,m-1,r.d));push(d,null,{calc:false})}break;
    case 'annual_bd': for(let y=y0;y<=y1;y++){push(addBD(iso(new Date(y,r.m-1,r.d)),r.bd),null,{calc:true})}break;
    case 'before_end': {const due=addBD(r.end,-r.bd),open=addBD(r.end,-r.window_bd);
      out.push({due,title:o.title+' – latest lodgement (window opened '+fmtS(open)+')',calc:true});break}
  }
  return out;
}
function allInstances(){
  const list=[];
  for(const [oi,o] of SEED.obligations.entries()){
    const known=(o.known||[]).map((k,i)=>({key:o.id+'|k'+i,oid:o.id,due:k.due,title:o.title,note:k.note,status0:k.status,src:'known',calc:false}));
    list.push(...known);
    if(o.rule.t==='undated'&&!known.length)list.push({key:o.id+'|u',oid:o.id,due:null,title:o.title,note:'',status0:'verify',src:'undated'});
    if(o.kind==='continuous'||o.rule.t==='none'){
      const lr=(ST.obl[o.id]||{}).lastReview;
      const rd=o.review_days||180;
      const due=lr?addD(lr,rd):addD(ST.first,14+(oi*5)%28);
      list.push({key:o.id+'|rev',oid:o.id,due,title:'Review: '+o.title,note:'Periodic compliance review ('+rd+'-day cycle). Mark done to restart the cycle.',status0:'review',src:'review',calc:true});
    }
    if(!['undated','none','event'].includes(o.rule.t)){
      for(const g of genRule(o)){
        if(known.some(k=>k.due&&Math.abs(diffD(k.due,g.due))<=10))continue;
        list.push({key:o.id+'|'+g.due,oid:o.id,due:g.due,title:g.title,note:g.calc?'Date calculated from the rule – confirm against the notice/invoice.':'',status0:'open',src:'rule',calc:g.calc});
      }
    }
  }
  for(const ev of ST.events){
    const et=EVT[ev.type];if(!et)continue;
    et.gen.forEach((g,i)=>{
      let due=ev.date;
      const sign=g.dir==='before'?-1:1;
      if(g.u==='bd')due=addBD(ev.date,sign*g.n);else if(g.u==='d')due=addD(ev.date,sign*g.n);else due=addM(ev.date,sign*g.n);
      list.push({key:'ev:'+ev.id+':'+i,oid:null,evId:ev.id,due,title:g.t+(ev.label?' – '+ev.label:''),note:'Triggered by event "'+et.label+'" on '+fmt(ev.date)+'.',status0:'open',src:'event',sev:g.sev,ref:g.ref,conseq:g.c,cat:'Event-triggered',reg:'—',calc:true});
    });
  }
  for(const c of ST.custom)list.push({key:'c:'+c.id,oid:null,due:c.due||null,title:c.title,note:c.note||'',status0:'open',src:'custom',sev:c.sev||2,cat:c.cat||'Custom',reg:c.reg||'—',owner:c.owner,calc:false,rep:c.rep});
  // enrich
  return list.map(i=>{
    const o=i.oid?OBL[i.oid]:null,s=ST.inst[i.key]||{};
    const x=Object.assign({},i,{sev:i.sev||(o&&o.sev)||2,cat:i.cat||(o&&o.category)||'',reg:i.reg||(o&&o.regulator)||'',owner:i.owner||(o&&((ST.obl[o.id]||{}).owner||o.owner))||'',ref:i.ref||(o&&o.ref)||'',conseq:i.conseq||(o&&o.consequence)||''});
    if(s.due!==undefined&&s.due!==null)x.due=s.due;
    x.done=!!s.done;x.doneOn=s.doneOn;x.snooze=s.snooze;x.userNote=s.note;
    x.days=x.due?diffD(x.due,TODAY):null;
    x.cls=x.done?'done':!x.due?'undated':x.days<0?'overdue':x.days<=7?'soon':x.days<=30?'month':'later';
    return x;
  }).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||b.sev-a.sev);
}

function offsetsFor(sev){return (ST.settings.reminders[sev]||[7,0])}
function reminderFor(i){ // returns label when a reminder is firing now
  if(i.done||!i.due)return null;
  if(i.snooze&&i.snooze>TODAY)return null;
  if(i.days<0)return {lvl:2,txt:'Overdue '+(-i.days)+'d'};
  const off=offsetsFor(i.sev).slice().sort((a,b)=>a-b);
  const mx=Math.max(...off);
  if(i.days<=mx){const hit=off.find(o=>i.days<=o);return {lvl:i.days<=3?2:1,txt:i.days===0?'Due today':'T-'+i.days+'d'}}
  return null;
}

function filtered(){
  return INST.filter(i=>{
    if(FILT.cat&&i.cat!==FILT.cat)return false;
    if(FILT.reg&&!(i.reg||'').startsWith(FILT.reg))return false;
    if(FILT.q&&!(i.title+' '+i.note+' '+i.ref+' '+i.cat+' '+i.reg+' '+i.owner).toLowerCase().includes(FILT.q.toLowerCase()))return false;
    if(FILT.own&&!(i.owner||'').toLowerCase().includes(FILT.own.toLowerCase()))return false;
    const s=FILT.st;
    if(s==='open'&&i.done)return false;
    if(s==='done'&&!i.done)return false;
    if(s==='overdue'&&i.cls!=='overdue')return false;
    if(s==='soon'&&!(i.cls==='soon'||i.cls==='overdue'))return false;
    if(s==='month'&&!['soon','month'].includes(i.cls))return false;
    if(s==='undated'&&i.cls!=='undated')return false;
    if(s==='verify'&&!(i.status0==='verify'&&!i.done))return false;
    return true;
  });
}

function closeDrawer(){$('#drawer').classList.remove('open');$('#veil').classList.remove('on')}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
function setInst(key,patch){ST.inst[key]=Object.assign(ST.inst[key]||{},patch);save()}
function openInst(key){
  const i=INST.find(x=>x.key===key);if(!i)return;
  const o=i.oid?OBL[i.oid]:null;
  drawer(`<div style="display:flex;justify-content:space-between;align-items:start"><h3 style="font-size:14pt">${esc(i.title)}</h3><button class="btn sm" id="x">Close</button></div>
  <div>${sevDot(i.sev)} Severity ${i.sev}/5 &nbsp; ${when(i)} ${i.status0==='verify'&&!i.done?'<span class="chip ver">verify</span>':''} ${i.calc&&i.due?'<span class="chip calc">calculated date</span>':''}</div>
  <div class="kv"><div>Due</div><div><input type="date" id="dd" value="${i.due||''}"> <span class="tag">${i.due?fmt(i.due):'set a date to schedule reminders'}</span></div>
  <div>Category</div><div>${esc(i.cat)}</div><div>Regulator</div><div>${esc(i.reg)}</div><div>Owner</div><div>${esc(i.owner)||'—'}</div>
  <div>Source</div><div>${esc(i.ref)||'—'}</div><div>If missed</div><div>${esc(i.conseq)||'—'}</div>
  ${i.cls!=='done'&&i.due?`<div>Reminders</div><div>${offsetsFor(i.sev).map(n=>n===0?'on the day':n+'d before').join(', ')}</div>`:''}</div>
  ${i.note?`<div class="panel" style="margin:8px 0"><b>Context</b><br>${esc(i.note)}</div>`:''}
  ${o?`<div class="panel" style="margin:8px 0"><b>What the obligation requires</b><br>${esc(o.what)}${o.notes?`<br><br><i>${esc(o.notes)}</i>`:''}</div>`:''}
  <div style="margin:8px 0"><b>Your notes</b><textarea id="nt">${esc(i.userNote||'')}</textarea></div>
  <div class="bar">
   ${i.done?`<button class="btn" id="undo">Re-open</button><span class="tag">Completed ${esc(i.doneOn||'')}</span>`:`<button class="btn p" id="done">Mark done</button>`}
   ${!i.done&&i.due?`<button class="btn" id="sn">Snooze reminder 3 days</button>`:''}
   ${i.src==='custom'?`<button class="btn" id="del">Delete task</button>`:''}
   ${o?`<button class="btn" id="seeO">View obligation</button>`:''}
  </div>`);
  $('#x').onclick=closeDrawer;
  $('#dd').onchange=e=>{setInst(key,{due:e.target.value||null});if(i.src==='custom'){const c=ST.custom.find(c=>'c:'+c.id===key);if(c)c.due=e.target.value}render();openInst(key)};
  $('#nt').onchange=e=>{setInst(key,{note:e.target.value});toast('Note saved')};
  if($('#done'))$('#done').onclick=()=>{
    setInst(key,{done:true,doneOn:TODAY});
    if(i.src==='review'){ST.obl[i.oid]=Object.assign(ST.obl[i.oid]||{},{lastReview:TODAY});delete ST.inst[key]}
    if(i.src==='custom'){const c=ST.custom.find(c=>'c:'+c.id===key);if(c&&c.rep){const n=nextRep(c.due,c.rep);ST.custom.push({...c,id:Date.now().toString(36),due:n})}}
    ST.log.push({t:TODAY,k:key,a:'done',title:i.title});save();render();closeDrawer();toast('Marked done')};
  if($('#undo'))$('#undo').onclick=()=>{setInst(key,{done:false,doneOn:null});render();openInst(key)};
  if($('#sn'))$('#sn').onclick=()=>{setInst(key,{snooze:addD(TODAY,3)});render();closeDrawer();toast('Snoozed to '+fmtS(addD(TODAY,3)))};
  if($('#del'))$('#del').onclick=()=>{ST.custom=ST.custom.filter(c=>'c:'+c.id!==key);save();render();closeDrawer()};
  if($('#seeO'))$('#seeO').onclick=()=>openObl(i.oid);
}
function nextRep(d,r){return r==='weekly'?addD(d,7):r==='monthly'?addM(d,1):r==='quarterly'?addM(d,3):addM(d,12)}
function addTask(){
  drawer(`<h3>Add task / commitment</h3>
  <div class="kv"><div>Title</div><div><input id="ct" style="width:100%"></div><div>Due</div><div><input type="date" id="cd" value="${addD(TODAY,7)}"></div>
  <div>Severity</div><div><select id="cs">${[1,2,3,4,5].map(n=>`<option ${n===2?'selected':''}>${n}</option>`).join('')}</select></div>
  <div>Category</div><div><select id="cc">${['Tenure','Environment','Land access','Overlapping tenure','Safety','Royalty','Fees','Market reporting','Corporate','Custom'].map(c=>`<option ${c==='Custom'?'selected':''}>${c}</option>`).join('')}</select></div>
  <div>Regulator</div><div><input id="cr" placeholder="e.g. DETSI"></div><div>Owner</div><div><input id="co" value=""></div>
  <div>Repeat</div><div><select id="cp"><option value="">No</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="quarterly">Quarterly</option><option value="annual">Annually</option></select></div>
  <div>Notes</div><div><textarea id="cn"></textarea></div></div>
  <div class="bar"><button class="btn p" id="ok">Add</button><button class="btn" id="x">Cancel</button></div>`);
  $('#x').onclick=closeDrawer;
  $('#ok').onclick=()=>{const t=$('#ct').value.trim();if(!t)return;ST.custom.push({id:Date.now().toString(36),title:t,due:$('#cd').value||null,sev:+$('#cs').value,cat:$('#cc').value,reg:$('#cr').value||'—',owner:$('#co').value,rep:$('#cp').value,note:$('#cn').value});save();render();closeDrawer();toast('Task added')};
}

/* ============================================================ register */
function vReg(m){
  const cats=[...new Set(SEED.obligations.map(o=>o.category))].sort();
  const q=(FILT.rq||'').toLowerCase();
  let list=SEED.obligations.filter(o=>(!FILT.rc||o.category===FILT.rc)&&(!FILT.rk||o.kind===FILT.rk)&&(!FILT.rf||o.conf===FILT.rf)&&(!q||(o.title+o.what+o.ref+o.instrument+o.regulator).toLowerCase().includes(q)));
  m.innerHTML=`<h2>Obligations register</h2>
  <div class="bar"><select id="rc">${selectOpts(cats,FILT.rc,'All categories')}</select>
  <select id="rk"><option value="">All types</option>${['obligation','event','continuous','matter','watch'].map(k=>`<option ${FILT.rk===k?'selected':''}>${k}</option>`).join('')}</select>
  <select id="rf"><option value="">All confidence</option>${[['verified','Verified from source'],['confirm','Confirm (2022 note / inbox)'],['applicability','Applicability to confirm']].map(([v,l])=>`<option value="${v}" ${FILT.rf===v?'selected':''}>${l}</option>`).join('')}</select>
  <input id="rq" placeholder="Search…" value="${esc(FILT.rq||'')}" style="min-width:220px"><span class="note">${list.length} of ${SEED.obligations.length}</span></div>
  <table><tr><th></th><th>Obligation</th><th>Instrument</th><th>Regulator</th><th>Source</th><th>Next</th><th>Confidence</th></tr>
  ${list.map(o=>{const nx=INST.filter(i=>i.oid===o.id&&!i.done&&i.due).sort((a,b)=>a.due.localeCompare(b.due))[0];
   return `<tr class="row" data-o="${o.id}"><td>${sevDot(o.sev)}</td><td><b>${esc(o.title)}</b><div class="tag">${esc(o.category)} · ${esc(o.kind)}</div></td><td>${esc(o.instrument)}</td><td>${esc(o.regulator)}</td><td class="tag">${esc(o.ref)}</td><td>${nx?`${fmtS(nx.due)} ${when(nx)}`:(o.kind==='event'?'<span class="tag">on event</span>':'<span class="tag">—</span>')}</td><td><span class="chip ${o.conf==='verified'?'':'ver'}">${o.conf}</span></td></tr>`}).join('')}</table>`;
  $('#rc').onchange=e=>{FILT.rc=e.target.value;vReg(m)};$('#rk').onchange=e=>{FILT.rk=e.target.value;vReg(m)};$('#rf').onchange=e=>{FILT.rf=e.target.value;vReg(m)};
  $('#rq').oninput=e=>{FILT.rq=e.target.value;clearTimeout(vReg.t);vReg.t=setTimeout(()=>{vReg(m);const q=$('#rq');q.focus();q.setSelectionRange(q.value.length,q.value.length)},300)};
  m.querySelectorAll('[data-o]').forEach(r=>r.onclick=()=>openObl(r.dataset.o));
}
function openObl(id){
  const o=OBL[id],s=ST.obl[id]||{};
  const ins=INST.filter(i=>i.oid===id).slice(0,8);
  drawer(`<div style="display:flex;justify-content:space-between"><h3 style="font-size:14pt">${esc(o.title)}</h3><button class="btn sm" id="x">Close</button></div>
  <div>${sevDot(o.sev)} Severity ${o.sev}/5 <span class="chip ${o.conf==='verified'?'':'ver'}">${o.conf}</span> <span class="chip">${esc(o.kind)}</span></div>
  <div class="kv"><div>Instrument</div><div>${esc(o.instrument)}</div><div>Regulator</div><div>${esc(o.regulator)}</div><div>Category</div><div>${esc(o.category)}</div>
  <div>Source</div><div>${esc(o.ref)}</div><div>Owner</div><div><input id="ow" value="${esc(s.owner||o.owner)}" style="width:100%"></div></div>
  <div class="panel"><b>What it requires</b><br>${esc(o.what)}</div>
  <div class="panel" style="margin-top:8px"><b>Consequence of non-compliance</b><br>${esc(o.consequence)}</div>
  ${o.notes?`<div class="panel" style="margin-top:8px"><b>Notes</b><br>${esc(o.notes)}</div>`:''}
  ${(o.src||[]).length?`<p><b>Sources</b><br>${o.src.map(x=>x.u?`<a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t)}</a>`:esc(x.t)).join('<br>')}</p>`:''}
  <h3 style="margin-top:14px">Scheduled items</h3>${ins.length?ins.map(itemRow).join(''):'<div class="note">'+(o.kind==='event'?'Event-triggered: log the event on the Events page to create the deadlines.':'None scheduled.')+'</div>'}
  <div style="margin-top:10px"><b>Your notes</b><textarea id="on">${esc(s.note||'')}</textarea></div>`);
  $('#x').onclick=closeDrawer;
  $('#ow').onchange=e=>{ST.obl[id]=Object.assign(ST.obl[id]||{},{owner:e.target.value});save();toast('Owner saved')};
  $('#on').onchange=e=>{ST.obl[id]=Object.assign(ST.obl[id]||{},{note:e.target.value});save();toast('Note saved')};
  bindItems($('#drawer'));
}

/* ============================================================ events */
function vEvt(m){
  m.innerHTML=`<h2>Events engine</h2><p class="note">Log a triggering event (a test stops, an entry is planned, a CCA is signed, a lease application is lodged…). The register converts it into dated deadlines with reminders, using the periods in the Acts and permits.</p>
  <div class="panel"><div class="bar"><select id="et">${SEED.events.map(e=>`<option value="${e.id}">${esc(e.label)}</option>`).join('')}</select>
  <input type="date" id="ed" value="${TODAY}"><input id="el" placeholder="Label (e.g. Well 6)" style="min-width:220px"><button class="btn p" id="el-add">Log event</button></div>
  <div id="prev" class="note"></div></div>
  <div class="sec-head">Logged events <span class="r">${ST.events.length}</span></div>
  <div class="panel">${ST.events.length?ST.events.map(e=>`<div class="item" style="grid-template-columns:100px 1fr auto"><div class="d">${fmtS(e.date)}</div><div><b>${esc(EVT[e.type].label)}</b> ${esc(e.label||'')}<div class="meta">${INST.filter(i=>i.evId===e.id).map(i=>fmtS(i.due)+' '+esc(i.title.split(' – ')[0])).join(' · ')}</div></div><div><button class="btn sm" data-del="${e.id}">Remove</button></div></div>`).join(''):'<div class="note">No events logged.</div>'}</div>
  <div class="sec-head">Event library</div>
  <table><tr><th>Event</th><th>Creates</th></tr>${SEED.events.map(e=>`<tr><td><b>${esc(e.label)}</b></td><td>${e.gen.map(g=>`<div>${esc(g.t)} <span class="tag">— ${g.n?g.n+(g.u==='bd'?' business days ':g.u==='d'?' days ':' months ')+g.dir:'on the day'} · ${esc(g.ref)}</span></div>`).join('')}</td></tr>`).join('')}</table>`;
  const prev=()=>{const e=EVT[$('#et').value],d=$('#ed').value;if(!d)return;$('#prev').innerHTML='Will create: '+e.gen.map(g=>{const s=g.dir==='before'?-1:1;const due=g.u==='bd'?addBD(d,s*g.n):g.u==='d'?addD(d,s*g.n):addM(d,s*g.n);return `<b>${fmtS(due)}</b> ${esc(g.t)}`}).join(' · ')};
  $('#et').onchange=prev;$('#ed').onchange=prev;prev();
  $('#el-add').onclick=()=>{ST.events.push({id:Date.now().toString(36),type:$('#et').value,date:$('#ed').value,label:$('#el').value});save();render();toast('Event logged – deadlines added to the calendar')};
  m.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ST.events=ST.events.filter(e=>e.id!==b.dataset.del);save();render()});
}

  $('#bk').onclick=()=>dl('compliance_backup_'+TODAY+'.json',JSON.stringify(ST,null,1),'application/json');
  $('#rs').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{ST=Object.assign(ST,JSON.parse(t));save();render();toast('Restored')})};
  $('#th').onclick=()=>{const d=document.documentElement;const dark=d.dataset.theme==='dark'||(!d.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);d.dataset.theme=dark?'light':'dark';ST.settings.theme=d.dataset.theme;save()};
  $('#kn').onclick=importKnowledge;

async function importKnowledge(){
  try{const r=await fetch('/api/knowledge');const j=await r.json();let n=0;
    for(const d of (j.deadlines||[])){if(!d.date)continue;if(ST.custom.some(c=>c.src_k===d.title+d.date))continue;
      ST.custom.push({id:'k'+Math.random().toString(36).slice(2,8),title:d.title,due:d.date,sev:3,cat:'From knowledge store',reg:'—',owner:'',note:(d.matter?d.matter+'. ':'')+(d.source||''),src_k:d.title+d.date});n++}
    save();render();toast(n+' items imported')}catch(e){toast('Import failed: '+e.message)}
}

/* ============================================================ export */
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const ics=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function fold(l){const o=[];while(l.length>73){o.push(l.slice(0,73));l=' '+l.slice(73)}o.push(l);return o.join('\r\n')}
function exportICS(list){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//State Gas//Compliance Register//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:State Gas Compliance'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';let n=0;
  for(const i of list){if(!i.due||i.done)continue;n++;
    L.push('BEGIN:VEVENT','UID:'+i.key.replace(/[^\w]/g,'')+'@stategas-compliance',fold('DTSTAMP:'+stamp),'DTSTART;VALUE=DATE:'+i.due.replace(/-/g,''),'DTEND;VALUE=DATE:'+addD(i.due,1).replace(/-/g,''),
      fold('SUMMARY:'+ics((i.sev>=4?'[!] ':'')+i.title)),fold('DESCRIPTION:'+ics((i.cat?i.cat+' | ':'')+(i.reg||'')+'\n'+(i.ref||'')+'\n'+(i.note||'')+(i.conseq?'\nIf missed: '+i.conseq:''))),'CATEGORIES:'+ics(i.cat||'Compliance'),'PRIORITY:'+(i.sev>=5?1:i.sev>=4?3:i.sev>=3?5:9));
    for(const d of offsetsFor(i.sev)){L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+ics(i.title.slice(0,80)),'TRIGGER:'+(d===0?'PT9H':'-P'+(d-1)+'DT15H'),'END:VALARM')}
    L.push('END:VEVENT')}
  L.push('END:VCALENDAR');dl('state_gas_compliance.ics',L.join('\r\n'),'text/calendar');toast(n+' events exported');
}
function exportCSV(list){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['Due','Status','Severity','Title','Category','Regulator','Owner','Source','Consequence','Note']].concat(list.map(i=>[i.due||'',i.done?'done':i.cls,i.sev,i.title,i.cat,i.reg,i.owner,i.ref,i.conseq,(i.userNote||i.note||'')]));
  dl('state_gas_compliance.csv','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv');
}
async function pushTodo(list){
  const items=list.filter(i=>i.due&&!i.done).map(i=>({key:i.key,title:(i.sev>=4?'[!] ':'')+i.title.slice(0,200),due:i.due,body:`${i.cat} | ${i.reg}\n${i.ref}\n${i.note||''}`,remind:offsetsFor(i.sev).map(n=>addD(i.due,-n)).filter(d=>d>=TODAY).sort()[0]||i.due}));
  if(!confirm('Create up to '+items.length+' tasks in the Microsoft To Do list "State Gas Compliance"? Tasks already pushed are skipped.'))return;
  try{
    if(MODE==='server'){const r=await fetch('/api/todo/push',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items})});const j=await r.json();toast(j.error?('To Do: '+j.error):(j.created+' created, '+j.skipped+' already there'));return}
    const t=await msalToken(true),h={Authorization:'Bearer '+t,'Content-Type':'application/json'};
    const g=async(u,o)=>{const r=await fetch(u.startsWith('http')?u:GRAPH+u,Object.assign({headers:h},o));if(!r.ok)throw new Error('Graph '+r.status);return r.json()};
    const lists=(await g('/me/todo/lists')).value||[];
    let l=lists.find(x=>x.displayName==='State Gas Compliance');
    if(!l)l=await g('/me/todo/lists',{method:'POST',body:JSON.stringify({displayName:'State Gas Compliance'})});
    const have=new Set();let u='/me/todo/lists/'+l.id+'/tasks?$top=200';
    while(u){const d=await g(u);for(const x of d.value||[]){(((x.body||{}).content||'').split('\n')).forEach(s=>{if(s.startsWith('KEY:'))have.add(s.trim())})}u=d['@odata.nextLink']}
    let c=0,s=0;
    for(const it of items){const k='KEY:'+it.key;if(have.has(k)){s++;continue}
      await g('/me/todo/lists/'+l.id+'/tasks',{method:'POST',body:JSON.stringify({title:it.title,body:{contentType:'text',content:it.body+'\n'+k},dueDateTime:{dateTime:it.due+'T00:00:00',timeZone:'E. Australia Standard Time'},isReminderOn:true,reminderDateTime:{dateTime:it.remind+'T08:30:00',timeZone:'E. Australia Standard Time'}})});c++}
    toast(c+' created, '+s+' already there');
  }catch(e){toast('To Do push failed: '+e.message)}
}

/* ============================================================ notifications */
function notifyDue(){
  if(!ST.settings.notify||!('Notification' in window)||Notification.permission!=='granted')return;
  const sentKey='sg_notified_'+TODAY;let sent=[];try{sent=JSON.parse(localStorage.getItem(sentKey)||'[]')}catch(e){}
  for(const i of INST){const r=reminderFor(i);if(!r||r.lvl<2)continue;const k=i.key+r.txt;if(sent.includes(k))continue;sent.push(k);try{new Notification('State Gas compliance – '+r.txt,{body:i.title})}catch(e){}}
  try{localStorage.setItem(sentKey,JSON.stringify(sent))}catch(e){}
}

/* ============================================================ boot */
(async()=>{
  const ok=await loadState();if(!ok)return;
  applyPrivate();
  if(ST.settings.theme)document.documentElement.dataset.theme=ST.settings.theme;
  for(const s of [5,4,3,2,1])if(!ST.settings.reminders[s])ST.settings.reminders[s]=[7,0];
  render();notifyDue();
  setInterval(()=>{if(!$('#drawer').classList.contains('open'))render()},15*60*1000);
})();
</script>
